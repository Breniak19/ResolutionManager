name: Compilar y Publicar Resolution Manager

on:
  push:
    branches: [ "master", "main" ] # Escucha ambas ramas por si tu repo principal se llama "main"

jobs:
  build:
    runs-on: windows-latest
    # Necesitamos permisos para crear el lanzamiento y subir archivos
    permissions:
      contents: write

    steps:
    - name: Descargar el código
      uses: actions/checkout@v4

    - name: Configurar MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Configurar NuGet
      uses: nuget/setup-nuget@v2

    - name: Restaurar dependencias
      # Restaura los paquetes listados en tu packages.config
      run: nuget restore

    - name: Compilar (Release)
      # Compila el proyecto usando MSBuild (el motor clásico de .NET Framework)
      run: msbuild /p:Configuration=Release

    - name: Crear Tag y Lanzamiento
      uses: softprops/action-gh-release@v2
      with:
        # Usa el número de ejecución para que cada versión sea única
        tag_name: v1.0.${{ github.run_number }}
        name: Resolution Manager Pro v1.0.${{ github.run_number }}
        body: |
          🚀 Nueva versión compilada automáticamente.
          - Compilado nativamente para .NET Framework 4.7.2.
          - Incluye Modo Focus inteligente.
          - Iconos de estado dinámicos.
          - Prioridad de proceso en tiempo real.
        draft: false
        prerelease: false
        # Busca el ejecutable en la carpeta por defecto donde MSBuild guarda los compilados
        # Usamos asteriscos por si el proyecto está dentro de una subcarpeta
        files: '**/bin/Release/ResolutionManager.exe'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
